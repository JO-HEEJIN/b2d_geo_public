<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>지도 데모 · b2d_geo</title>
  <meta name="description" content="주소를 검색하고 지도를 클릭하면 필지·공시지가·용도지역·토지특성·주변 상가를 한눈에.">
  <link rel="stylesheet" href="/vendor/leaflet.css">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/"><span class="glyph">B</span> b2d_geo</a>
    <nav>
      <a href="/map.html" class="active">지도 데모</a>
      <a href="/batch.html">배치</a>
      <a href="/docs.html">API 문서</a>
      <button class="btn ghost" style="padding:7px 11px" onclick="toggleTheme()" aria-label="테마 전환">◐</button>
    </nav>
  </header>

  <div class="map-app">
    <aside class="map-panel">
      <div class="search-wrap">
        <div class="search-row">
          <input id="q" type="text" placeholder="도로명주소 입력 (예: 경기도 하남시 대청로 10)"
                 autocomplete="off" enterkeyhint="search">
          <button class="btn" id="go">검색</button>
        </div>
        <div class="examples" id="examples"></div>
        <p class="hint">주소를 검색하거나 <b>지도를 클릭</b>하면 그 지점의 토지 정보를 조회합니다.</p>
      </div>
      <div class="toggle-row">
        <label><input type="checkbox" id="poiToggle"> 주변 상가 표시</label>
        <label style="margin-left:auto"><input type="checkbox" id="lotsToggle"> 표준지 표시</label>
      </div>
      <div class="results" id="results">
        <div class="placeholder-msg">
          <div class="big">🗺️</div>
          주소 검색 또는 지도 클릭으로<br>토지 인텔리전스를 조회하세요.
        </div>
      </div>
    </aside>
    <div id="map"></div>
  </div>

  <footer class="landing-foot">
    <div>
      <a href="https://api.birth2death.com/map.html" rel="noopener">라이브 지도 데모</a>·
      <a href="https://api.birth2death.com/docs.html" rel="noopener">라이브 API 문서</a>
    </div>
    <p style="margin-top:6px">면접 검토용 공개 코드 스냅샷</p>
  </footer>

  <script src="/vendor/leaflet.js"></script>
  <script src="/shared.js"></script>
  <script src="/map.js"></script>
</body>
</html>
